<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, Monaco, monospace;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .cursor {
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>

  <!-- Card Background -->
  <rect x="5" y="5" width="840" height="240" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Window Header Bar -->
  <rect x="5" y="5" width="840" height="40" rx="16" fill="#131b2e" />
  <rect x="5" y="25" width="840" height="20" fill="#131b2e" />
  <line x1="5" y1="45" x2="845" y2="45" stroke="#1f293d" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="30" cy="25" r="6" fill="#ef4444" />
  <circle cx="48" cy="25" r="6" fill="#f59e0b" />
  <circle cx="66" cy="25" r="6" fill="#10b981" />

  <!-- Window Title -->
  <text x="425" y="29" fill="#64748b" font-size="12" class="mono" text-anchor="middle">terminal ~ dev-shehzad</text>

  <!-- Prompt Command -->
  <g transform="translate(40, 78)">
    <text x="0" y="0" fill="#10b981" font-size="14" class="mono" font-weight="600">➜</text>
    <text x="20" y="0" fill="#38bdf8" font-size="14" class="mono">~/portfolio</text>
    <text x="125" y="0" fill="#94a3b8" font-size="14" class="mono">git:(<tspan fill="#f43f5e">main</tspan>)</text>
    <text x="215" y="0" fill="#e2e8f0" font-size="14" class="mono">whoami</text>
  </g>

  <!-- Main Title: < Shehzad /> in Coding Font -->
  <text x="40" y="145" fill="url(#neon-grad)" font-size="44" font-weight="800" class="mono" filter="url(#glow)">&lt; Shehzad /&gt;</text>
  <rect x="350" y="112" width="12" height="38" fill="#38bdf8" class="cursor" />

  <!-- Subtitle -->
  <text x="42" y="180" fill="#94a3b8" font-size="16" class="sans" font-weight="400">Full-Stack Developer &amp; Problem Solver | Building Scalable Modern Web Experiences</text>

  <!-- Status Pills -->
  <g transform="translate(42, 205)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="160" height="26" rx="13" fill="url(#badge-grad)" stroke="#334155" stroke-width="1" />
    <circle cx="15" cy="13" r="4" fill="#10b981" />
    <text x="26" y="17" fill="#cbd5e1" font-size="11" class="mono" font-weight="500">Available for hire</text>

    <!-- Pill 2 -->
    <rect x="175" y="0" width="180" height="26" rx="13" fill="url(#badge-grad)" stroke="#334155" stroke-width="1" />
    <text x="190" y="17" fill="#38bdf8" font-size="11" class="mono" font-weight="500">⚡ React • Next • Node</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="170" height="26" rx="13" fill="url(#badge-grad)" stroke="#334155" stroke-width="1" />
    <text x="385" y="17" fill="#c084fc" font-size="11" class="mono" font-weight="500">☕ Coffee + Code 24/7</text>
  </g>
</svg>
