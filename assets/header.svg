<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0a0f1d" />
    </linearGradient>

    <!-- Subtle Ambient Glow -->
    <radialGradient id="ambient-cyan" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-indigo" cx="15%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <!-- Name Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Pill Background -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'Roboto Mono', Consolas, monospace;
    }
  </style>

  <!-- Card Background with Border -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#card-bg)" stroke="url(#border-glow)" stroke-width="1.2" />

  <!-- Ambient Light Overlays -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#ambient-cyan)" />
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#ambient-indigo)" />

  <!-- Content -->
  <g transform="translate(48, 42)">
    <!-- Small Overline -->
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2.5" class="font-mono">FULL-STACK SOFTWARE DEVELOPER</text>

    <!-- Name Heading -->
    <text x="0" y="44" fill="url(#name-grad)" font-size="40" font-weight="800" letter-spacing="-0.5" class="font-sans">M Shehzad</text>

    <!-- Subtitle / Mission -->
    <text x="0" y="80" fill="#94a3b8" font-size="15" font-weight="400" class="font-sans">
      Building scalable web applications, modern frontends &amp; high-performance backends.
    </text>

    <!-- Pills / Core Strengths -->
    <g transform="translate(0, 108)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="180" height="28" rx="14" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="14" r="3.5" fill="#38bdf8" />
        <text x="28" y="18" fill="#e2e8f0" font-size="12" font-weight="500" class="font-sans">React &amp; Next.js</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(192, 0)">
        <rect x="0" y="0" width="195" height="28" rx="14" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="14" r="3.5" fill="#818cf8" />
        <text x="28" y="18" fill="#e2e8f0" font-size="12" font-weight="500" class="font-sans">Node.js &amp; Python</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(399, 0)">
        <rect x="0" y="0" width="225" height="28" rx="14" fill="url(#pill-bg)" stroke="#334155" stroke-width="1" />
        <circle cx="16" cy="14" r="3.5" fill="#34d399" />
        <text x="28" y="18" fill="#e2e8f0" font-size="12" font-weight="500" class="font-sans">Modern Web Architecture</text>
      </g>
    </g>
  </g>
</svg>
